# fibby — настройки Netlify. Сборки нет: публикуем папку site как есть.
[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# шрифты и библиотеки не меняются — кешируем надолго
[[headers]]
  for = "/assets/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# настройки правятся руками, кеш не нужен
[[headers]]
  for = "/assets/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"
